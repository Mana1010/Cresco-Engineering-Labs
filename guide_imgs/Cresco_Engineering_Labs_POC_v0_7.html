        Object.entries(sheet.cells).forEach(([a, c]) => {
          if (c.kind === "input") {
            const v =
              inputs && inputs[c.name] !== undefined ? inputs[c.name] : c.v;
            val[c.name] = Number(v);
            val[a] = Number(v);

        });
        const get = (k) =>
          val[k] !== undefined
            ? val[k]
            : n2a[k] && val[n2a[k]] !== undefined
              ? val[n2a[k]]
              : 0;
        const fcells = Object.entries(sheet.cells).filter(([a, c]) => c.f);
        for (let p = 0; p < fcells.length + 2; p++) {
          fcells.forEach(([a, c]) => {
            try {
              const r = c.f(get);
              if (isFinite(r)) {
                val[a] = r;
                if (c.name) val[c.name] = r;

      function calcStatusTag(s) {
        const m = {
          complete: ["Green", "Complete"],
          review: ["Amber", "In review"],
          running: ["Indigo", "Running"],
          queued: ["Blue", "Queued"],
          not_started: ["Grey", "Not started"],
        };
        return m[s] || ["Grey", s];
      }
      function lastCheck(c) {
        const rs = c.revs || [];
        const r = rs.length ? rs[rs.length - 1] : null;
        return r && r.check ? r.check : null;
      }
      function chkTag(c) {
        const k = lastCheck(c);
        return k && k.outcome === "returned" ? (
          <Tag k="Red">↩ Returned</Tag>
        ) : null;
      }

      function buildJson(project, ci) {
        const cat = catById(ci.catId);
        const chk = lastCheck(ci);
        let data = {};
        if (cat.id === "checkwind") {
          data = {
            wind_region: "A (non-cyclonic)",
            regional_wind_speed_V500: { value: 45, unit: "m/s" },
            site_elevation: { value: 186, unit: "m AHD" },
            climate_change_multiplier: 1.0,
            terrain_category_by_direction: {
              N: "TC2",
              NE: "TC2.5",
              E: "TC2",
              SE: "TC3",
              S: "TC2.5",
              SW: "TC2",
              W: "TC2",
              NW: "TC2",
            },
            multipliers_worst_direction: {
              Mz_cat: 0.91,
              Ms: 0.85,
              Mt: 1.0,
              Md: 1.0,
            },
            feeds_forward_to: ["skyciv", "windpressure", "windbrace"],
          };
        } else if (cat.runner === "excel" && SHEETS[cat.sheet]) {
          const sheet = SHEETS[cat.sheet];
          const val = computeSheet(sheet, null);
          const inputs = {},
            results = {};
          for (let rn = 1; rn <= sheet.rows; rn++) {
            const lab = sheet.cells["A" + rn],
              b = sheet.cells["B" + rn],
              u = sheet.cells["C" + rn];
            if (!lab || !b) continue;
            const key = b.name || "row_" + rn;
            if (b.kind === "input")
              inputs[key] = {
                label: lab.v,
                value: b.v,
                unit: (u && u.v) || null,
              };
            else if (b.f && val[b.name] !== undefined && isFinite(val[b.name]))
              results[key] = {
                label: lab.v,
                value: Number(
                  val[b.name].toFixed(b.dp !== undefined ? b.dp : 3),
                ),
                unit: (u && u.v) || null,
              };
          }
          data = { workbook: sheet.file, inputs: inputs, results: results };
        } else if (cat.runner === "python" && PY[cat.pyKey]) {
          const def = PY[cat.pyKey];
          const inp = {};
          def.fields.forEach((f) => (inp[f.name] = f.v));
          const out = def.run(inp);
          const inputs = {},
            results = {};
          def.fields.forEach(
            (f) =>
              (inputs[f.name] = { label: f.label, value: f.v, unit: f.unit }),
          );
          out.rows.forEach(
            (r, i) =>
              (results["r" + i] = { label: r[0], value: r[1], unit: r[2] }),
          );
          data = { service: cat.id, inputs: inputs, results: results };
        } else if (cat.type === "api" && API[cat.apiKey]) {
          const def = API[cat.apiKey];
          const inp = {};
          def.fields.forEach((f) => (inp[f.name] = f.v));
          const out = def.run(inp);
          out.groups.forEach((g) => {
            const o = {};
            g.rows.forEach((r) => (o[r[0]] = r[1]));
            data[g.g] = o;
          });
        } else {
          data = { result: ci.result || null };
        }
        return {
          status: "success",
          source:
            cat.id === "checkwind"
              ? "hazard_api"
              : cat.id === "skyciv"
                ? "skyciv"
                : "internal",
          calculation_id: "ENG-" + (100000 + (ci.iid % 900000)),
          cached_at: null,
          standard_edition: EDN[cat.id] || null,
          classification: "Preliminary — Subject to Engineer Review",
          project: {
            labs: project.id,
            portal: project.portal,
            synergy: project.syn,
            name: project.name,
          },
          calculation: {
            catalogue_id: cat.id,
            name: cat.name,
            instance_label: ci.label || null,
            version: cat.ver,
            revision: ci.rev || "A",
            run_at: ci.ranAt,
            run_by: ci.by,
            autonomous: !!ci.auto,
            returned:
              chk && chk.outcome === "returned"
                ? { by: chk.by, on: chk.on, reason: chk.reason || null }
                : null,
          },
          attribution: cat.attribution || null,
          data: data,
          poc_note:
            "Representative demo data — production serves live values from /api/v1 with X-API-Key auth.",
        };
      }

        if (!isFinite(v)) return "—";
        return Number(v).toLocaleString(undefined, {
          minimumFractionDigits: dp || 0,
          maximumFractionDigits: dp || 0,
        });
      }

        const sheet = SHEETS[sheetKey];

        const [sel, setSel] = useState("B4");
        const val = useMemo(
          () => computeSheet(sheet, inputs),
          [inputs, sheetKey],

            Object.assign({}, p, { [name]: v === "" ? "" : Number(v) }),
          );

        const selCell = sheet.cells[sel];
        let fbar = "";
        if (selCell) {
          if (selCell.kind === "input") fbar = String(inputs[selCell.name]);

                                }}

                                {c.v}

                          const isSel = sel === addr;
                          if (c.kind === "label")

                                  background: "#FFFDF0",

      /* ----- Python runner: read-only code + genuine compute ----- */
      function PythonRunner({ pyKey, user, cat, toast, onComplete }) {
        const def = PY[pyKey];
        const [inputs, setInputs] = useState(() => {
          const o = {};
          def.fields.forEach((f) => (o[f.name] = f.v));
          return o;
        });
        const [res, setRes] = useState(null);
        function run() {
          setRes(def.run(inputs));
          onComplete();
          toast("Calculation executed in-browser · run logged", "success");
        }
        const maxBar = res
          ? Math.max.apply(
              null,
              res.bars.map((b) => b[1]),
            ) || 1
          : 1;
        return (
          <div
            style={{
              display: "grid",
              gridTemplateColumns: "1.15fr 1fr",
              gap: 16,
              marginTop: 14,
            }}
          >
            <div>
              <div
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 8,
                  padding: "7px 12px",
                  background: "#0B1220",
                  borderRadius: "8px 8px 0 0",
                }}
              >
                <span
                  style={{
                    color: "#fff",
                    fontSize: 11.5,
                    fontFamily: "monospace",
                  }}
                >
                  {cat.id}.py
                </span>
                <Tag k="Green" style={{ marginLeft: "auto" }}>
                  Read-only · server-side logic
                </Tag>
              </div>
              <pre
                style={{
                  margin: 0,
                  background: "#0F172A",
                  color: "#E2E8F0",
                  padding: "14px 16px",
                  borderRadius: "0 0 8px 8px",
                  fontSize: 11.5,
                  lineHeight: 1.55,
                  overflow: "auto",
                  fontFamily: "'Menlo','Monaco',monospace",
                  maxHeight: 360,
                }}
              >
                {def.code}
              </pre>
              <div
                style={{
                  fontSize: 11,
                  color: B.muted,
                  marginTop: 8,
                  lineHeight: 1.5,
                }}
              >
                Source is read-only — proprietary logic runs as a server-side
                service class and is never editable by the engineer. This POC
                executes an equivalent in the browser.
              </div>
            </div>
            <div>
              <Cd>
                <SectionTitle>Inputs</SectionTitle>
                {def.fields.map((f) => (
                  <div key={f.name} style={{ marginBottom: 11 }}>
                    <div
                      style={{
                        fontSize: 11.5,
                        fontWeight: 600,
                        color: B.text,
                        marginBottom: 4,

                      {f.label}{" "}
                      <span style={{ color: B.muted, fontWeight: 400 }}>
                        ({f.unit})

                    <input
                      type="number"
                      value={inputs[f.name]}
                      onChange={(e) =>
                        setInputs((p) =>
                          Object.assign({}, p, {
                            [f.name]: Number(e.target.value),
                          }),
                        )
                      }
                      style={{
                        width: "100%",
                        padding: "8px 10px",

                        border: "1px solid " + B.bdr,
                        fontSize: 13,

                  </div>
                ))}
                <Btn
                  kind="pri"
                  onClick={run}
                  style={{ width: "100%", marginTop: 4 }}
                >
                  ▶ Run calculation
                </Btn>

      /* ----- API runner: stubbed, realistic ----- */
      function ApiRunner({ apiKey, user, cat, toast, onComplete }) {
        const def = API[apiKey];
        const [inputs, setInputs] = useState(() => {
          const o = {};
          def.fields.forEach((f) => (o[f.name] = f.v));
          return o;
        });
        const [res, setRes] = useState(null);
        const [busy, setBusy] = useState(false);
        function run() {
          setBusy(true);
          setRes(null);
          setTimeout(() => {
            setRes(def.run(inputs));
            setBusy(false);
            onComplete();
            toast(def.source + " responded · run logged", "success");
          }, 850);
        }
        return (
          <div
            style={{
              display: "grid",
              gridTemplateColumns: "1fr 1.4fr",
              gap: 16,
              marginTop: 14,
            }}
          >
            <Cd>
              <SectionTitle>Request</SectionTitle>
              {def.fields.map((f) => (
                <div key={f.name} style={{ marginBottom: 11 }}>
                  <div
                    style={{
                      fontSize: 11.5,
                      fontWeight: 600,
                      color: B.text,
                      marginBottom: 4,
                    }}
                  >
                    {f.label}
                  </div>
                  {f.type === "select" ? (
                    <select
                      value={inputs[f.name]}
                      onChange={(e) =>
                        setInputs((p) =>
                          Object.assign({}, p, { [f.name]: e.target.value }),
                        )
                      }
                      style={{
                        width: "100%",
                        padding: "8px 10px",
                        borderRadius: 7,
                        border: "1px solid " + B.bdr,
                        fontSize: 12.5,
                      }}
                    >
                      {f.opts.map((o) => (
                        <option key={o}>{o}</option>
                      ))}
                    </select>
                  ) : (
                    <input
                      value={inputs[f.name]}
                      onChange={(e) =>
                        setInputs((p) =>
                          Object.assign({}, p, { [f.name]: e.target.value }),
                        )
                      }
                      style={{
                        width: "100%",
                        padding: "8px 10px",
                        borderRadius: 7,
                        border: "1px solid " + B.bdr,

              <Btn

                response normalisation handled server-side.{" "}
                {apiKey === "checkwind" &&

            </Cd>
            <div>
              {!res && !busy && (
                <Cd
                  style={{
                    textAlign: "center",

                    padding: "40px 20px",
                  }}

      /* ============================ REVISIONS & CHECKS ============================ */
      function RevisionPanel({
        project,
        calc,
        user,
        onNewRev,
        onCheck,
        toast,
      }) {
        const revs = calc.revs && calc.revs.length ? calc.revs : [];
        const [reason, setReason] = useState("Data entry");
        const last = revs.length ? revs[revs.length - 1] : null;
        const returned =
          last && last.check && last.check.outcome === "returned";
        return (
          <Cd style={{ marginTop: 14 }}>
            <SectionTitle>Revisions</SectionTitle>
            <div
              style={{
                fontSize: 11.5,
                color: B.muted,
                marginBottom: 8,
                lineHeight: 1.5,
              }}
            >
              Append-only revision history listing the engineer who produced
              each revision. Anyone who identifies an error can return the
              calculation with a reason; the correction is made as a new
              revision, and superseded revisions are retained in the audit log
              for PI defence.
            </div>
            {revs.length === 0 && (
              <div style={{ fontSize: 12, color: B.muted, padding: "8px 0" }}>
                No revisions yet — the first run records Rev A.
              </div>
            )}
            {revs.map((r, i) => (
              <div
                key={i}
                style={{
                  display: "flex",
                  gap: 10,
                  alignItems: "center",
                  padding: "7px 0",
                  borderTop: i ? "1px solid " + B.bdr : "none",
                  fontSize: 12,
                  flexWrap: "wrap",
                }}
              >
                <Tag k={i === revs.length - 1 ? "Indigo" : "Grey"}>
                  Rev {r.rev}
                </Tag>
                <span style={{ fontFamily: "monospace", color: B.muted }}>
                  {r.ranAt || "—"}
                </span>
                <span style={{ flex: 1, color: B.text, minWidth: 110 }}>
                  Engineer:{" "}
                  <b style={{ color: B.navy }}>{r.by ? uName(r.by) : "—"}</b>
                </span>
                {r.check && r.check.outcome === "returned" && (
                  <Tag k="Red">
                    ↩ Returned — {r.check.reason} · {uName(r.check.by)}
                  </Tag>
                )}
              </div>
            ))}
            <div
              style={{
                display: "flex",
                gap: 8,
                marginTop: 12,
                flexWrap: "wrap",
                alignItems: "center",
              }}
            >
              <Btn kind="soft" sm onClick={() => onNewRev(project, calc)}>
                ＋ New revision
              </Btn>
              {last && !returned && (
                <Fragment>
                  <select
                    value={reason}
                    onChange={(e) => setReason(e.target.value)}
                    style={{
                      padding: "6px 9px",
                      borderRadius: 7,
                      border: "1px solid " + B.bdr,
                      fontSize: 11.5,
                    }}

                    {[
                      "Data entry",
                      "Wrong edition",
                      "Assumption",
                      "Tool defect",
                    ].map((o) => (
                      <option key={o}>{o}</option>
                    ))}
                  </select>
                  <Btn
                    kind="danger"
                    sm
                    onClick={() => onCheck(project, calc, "returned", reason)}
                  >
                    ↩ Return calculation
                  </Btn>
                </Fragment>
              )}
              {returned && (
                <span
                  style={{ fontSize: 11, color: B.danger, fontStyle: "italic" }}
                >
                  Returned — create a new revision to correct and supersede.
                </span>
              )}
            </div>
          </Cd>
        );
      }

        const [ref, setRef] = useState("");

        function provision() {
          const r = ref.trim();
          if (!r) {
            toast("Enter a Portal project reference", "warn");
            return;
          }
          const existing = projects.find((p) => p.portal === r);
          if (existing) {
            setSyncLog((s) =>
              [
                {
                  ts: nowts(),
                  portal: r,
                  lab: existing.id,
                  ev: "dedup",
                  msg:
                    "Duplicate create request ignored — Labs project already linked to Portal #" +
                    r,
                },
              ].concat(s),
            );
            toast(
              "No duplicate created — Portal #" +
                r +
                " already maps to " +
                existing.id,
              "warn",
            );
            return;
          }
          const lab = "LAB-2026-0" + (160 + Math.floor(Math.random() * 39));
          const np = {
            id: lab,
            portal: r,
            syn: "SYN-" + (8862 + Math.floor(Math.random() * 40)),
            name: "New Portal Project #" + r,
            client: "—",
            loc: "NSW",
            ty,
            team:
              ty === "STR-RESI"
                ? "Residential (Biax)"
                : ty === "CIVIL"
                  ? "Civil"
                  : "Structural",
            owner: user.id,
            st: "01",
            created: "2026-06-30",
            summary:
              "Provisioned on proposal acceptance via the Labs API. One Labs project per Portal/Synergy project.",
            calcs: [],
          };
          const a2 = autos.find((a) => a.id === "a2");
          const a4 = autos.find((a) => a.id === "a4");
          const a5 = autos.find((a) => a.id === "a5");
          if ((ty === "STR-RESI" || ty === "ARCH") && a4 && a4.enabled)
            np.calcs.push(
              mkCalc("climatezone", {
                status: "complete",
                auto: true,
                ranAt: nowts(),
                by: "system",
                trigger: "Auto-run: Proposal → Accepted",
                result: "Climate Zone — auto-run on acceptance",
              }),
            );
          if (ty === "STR-RESI" && a5 && a5.enabled)
            np.calcs.push(
              mkCalc("archextract", {
                status: "queued",

                trigger: "Auto: Proposal → Accepted — job created & submitted",

            );
          setProjects((p) => [np].concat(p));

            extra.push("Arch Extract job submitted");
          if ((ty === "STR-RESI" || ty === "ARCH") && a4 && a4.enabled)
            extra.push("Climate Zone auto-run");
          toast(
            lab +
              " provisioned" +
              (extra.length ? " · " + extra.join(" · ") : ""),
            "success",

          setRef("");

                    governed upstream source, or one that differs from it (e.g.
                    CheckWind wind data, geotechnical parameters, standard
                    edition).
                  </div>
                </Cd>
                <Cd>
                  <SectionTitle>Timeliness</SectionTitle>
                  {[
                    ["Provisioning → first calculation", "1.8 days median"],
                    ["Run → review", "22 h median"],
                    ["Awaiting review", "9 calcs · oldest 6 days"],
                  ].map(([k, v]) => (
                    <div
                      key={k}
                      style={{
                        display: "flex",
                        justifyContent: "space-between",
                        padding: "6px 0",
                        borderTop: "1px solid " + B.bdr,
                        fontSize: 12,
                      }}
                    >
                      <span style={{ color: B.muted }}>{k}</span>
                      <b style={{ color: B.navy }}>{v}</b>
                    </div>
                  ))}
                </Cd>
              </div>
            </div>
            <div
              style={{
                display: "grid",
                gridTemplateColumns: "1.3fr 1fr",
                gap: 16,
              }}
            >
              <Cd>
                <SectionTitle>Tool popularity (last 30 days)</SectionTitle>
                <Bars data={tools} />
              </Cd>
              <div style={{ display: "grid", gap: 16 }}>
                <Cd>
                  <SectionTitle>External API quota</SectionTitle>
                  <div style={{ marginBottom: 12 }}>
                    <div
                      style={{
                        display: "flex",
                        justifyContent: "space-between",
                        fontSize: 12,
                        marginBottom: 4,
                      }}
                    >
                      <span style={{ fontWeight: 600 }}>
                        Revolutio Hazard API
                      </span>
                      <span style={{ color: B.muted }}>312 / 500 calls</span>
                    </div>
                    <div
                      style={{
                        height: 9,
                        background: B.lightBg,
                        borderRadius: 5,
                        overflow: "hidden",
                      }}
                    >
                      <div
                        style={{
                          height: "100%",
                          width: "62%",
                          background: B.warn,
                          borderRadius: 5,
                        }}
                      ></div>
                    </div>
                    <div
                      style={{ fontSize: 10.5, color: B.muted, marginTop: 3 }}
                    >
                      Renews 1 Aug 2026
                    </div>
                  </div>
                  <div>
                    <div
                      style={{
                        display: "flex",
                        justifyContent: "space-between",
                        fontSize: 12,
                        marginBottom: 4,
                      }}
                    >
                      <span style={{ fontWeight: 600 }}>SkyCiv API v3</span>
                      <span style={{ color: B.muted }}>88 / 250 credits</span>
                    </div>
                    <div
                      style={{
                        height: 9,
                        background: B.lightBg,
                        borderRadius: 5,
                        overflow: "hidden",
                      }}
                    >
                      <div
                        style={{
                          height: "100%",
                          width: "35%",
                          background: B.success,
                          borderRadius: 5,
                        }}
                      ></div>
                    </div>
                    <div
                      style={{ fontSize: 10.5, color: B.muted, marginTop: 3 }}
                    >
                      Renews 14 Jul 2026
                    </div>
                  </div>
                </Cd>
                <Cd>
                  <SectionTitle>External API health (24h)</SectionTitle>
                  {[
                    ["Revolutio Hazard API", "up", "210 ms"],
                    ["SkyCiv API v3", "up", "640 ms"],
                    ["BOM ARR 2019", "up", "180 ms"],
                  ].map(([n, st, t]) => (
                    <div

                        ></span>

      }

      /* ============================ APP ============================ */
      function App() {
        const [user, setUser] = useState(null);
        const [view, setView] = useState("projects");
        const [scope, setScope] = useState("mine");
        const [pid, setPid] = useState(null);
        const [runCtx, setRunCtx] = useState(null);
        const [projects, setProjects] = useState(PROJECTS_SEED);
        const [catalogue, setCatalogue] = useState(CAT);
        const [autos, setAutos] = useState(AUTOMATIONS_SEED);
        const [syncLog, setSyncLog] = useState(SYNC_SEED);
        const [toast, toastNode] = useToast();

        if (!user)
          return (
            <Login
              onLogin={(u) => {
                setUser(u);
                setScope("mine");
              }}
            />
          );

        function openProject(id) {
          setPid(id);
          setRunCtx(null);
          setView("project");
        }
        function runCalc(project, calc) {
          setRunCtx({ pid: project.id, iid: calc.iid });
        }
        function markComplete(project, calc) {
          const ts = new Date().toISOString().slice(0, 16).replace("T", " ");
          setProjects((prev) =>
            prev.map((p) =>
              p.id !== project.id
                ? p
                : Object.assign({}, p, {
                    calcs: p.calcs.map((c) => {
                      if (c.iid !== calc.iid) return c;
                      const rs = (
                        c.revs && c.revs.length
                          ? c.revs
                          : [{ rev: c.rev || "A", ranAt: null, by: null }]
                      ).slice();
                      rs[rs.length - 1] = Object.assign({}, rs[rs.length - 1], {
                        ranAt: ts,
                        by: user.id,
                      });
                      return Object.assign({}, c, {
                        status: "complete",
                        ranAt: ts,
                        by: user.id,
                        rev: rs[rs.length - 1].rev,
                        revs: rs,
                      });
                    }),
                  }),
            ),
          );
        }
        function newRevision(project, calc) {
          const ts = new Date().toISOString().slice(0, 16).replace("T", " ");
          setProjects((prev) =>
            prev.map((p) =>
              p.id !== project.id
                ? p
                : Object.assign({}, p, {
                    calcs: p.calcs.map((c) => {
                      if (c.iid !== calc.iid) return c;
                      const rs = (
                        c.revs && c.revs.length
                          ? c.revs
                          : [{ rev: "A", ranAt: c.ranAt, by: c.by }]
                      ).slice();
                      const nx = String.fromCharCode(65 + rs.length);
                      rs.push({ rev: nx, ranAt: ts, by: user.id });
                      return Object.assign({}, c, {
                        rev: nx,
                        revs: rs,
                        ranAt: ts,
                        by: user.id,
                      });
                    }),
                  }),
            ),
          );
          toast(
            "Revision created — inputs carried forward; the superseded revision is retained in the audit log",
            "success",
          );
        }
        function checkCalc(project, calc, outcome, reason) {
          const ts = new Date().toISOString().slice(0, 16).replace("T", " ");
          setProjects((prev) =>
            prev.map((p) =>
              p.id !== project.id
                ? p
                : Object.assign({}, p, {
                    calcs: p.calcs.map((c) => {
                      if (c.iid !== calc.iid) return c;
                      const rs = (
                        c.revs && c.revs.length
                          ? c.revs
                          : [{ rev: c.rev || "A", ranAt: c.ranAt, by: c.by }]
                      ).slice();
                      rs[rs.length - 1] = Object.assign({}, rs[rs.length - 1], {
                        check: {
                          by: user.id,
                          on: ts,
                          outcome: outcome,
                          reason: reason,
                        },
                      });
                      return Object.assign({}, c, { revs: rs });
                    }),
                  }),
            ),
          );
          toast(
            outcome === "pass"
              ? "Check recorded — pass"
              : "Returned for correction — " + reason,
            outcome === "pass" ? "success" : "warn",
          );
        }

        const curProj = projects.find((p) => p.id === pid);
        const curCalc =
          curProj && runCtx
            ? curProj.calcs.find((c) => c.iid === runCtx.iid)
            : null;
        let crumb = "Engineering Labs";
        if (view === "project" && curProj)
          crumb =
            "Projects / " +
            curProj.name +
            (curCalc ? " / " + catById(curCalc.catId).name : "");
        else {
          const n = NAV.find((x) => x.k === view);
          if (n) crumb = "Engineering Labs / " + n.l;
        }

        return (
          <div style={{ display: "flex", height: "100vh" }}>
            <Sidebar
              view={view === "project" ? "projects" : view}
              setView={(v) => {
                setView(v);
                setPid(null);
                setRunCtx(null);
              }}
              user={user}
            />
            <div
              style={{
                flex: 1,
                display: "flex",
                flexDirection: "column",
                minWidth: 0,
              }}
            >
              <TopBar
                user={user}
                crumb={crumb}
                onSwitch={(u) => setUser(u)}
                onSignout={() => {
                  setUser(null);
                  setView("projects");
                  setPid(null);
                }}
              />
              <div style={{ flex: 1, overflow: "auto", padding: "22px 26px" }}>
                {view === "projects" && (
                  <ProjectsView
                    user={user}
                    projects={projects}
                    scope={scope}
                    setScope={setScope}
                    open={openProject}
                    toast={toast}
                  />
                )}
                {view === "catalogue" && (
                  <CatalogueView
                    user={user}
                    catalogue={catalogue}
                    setCatalogue={setCatalogue}
                    toast={toast}
                  />
                )}
                {view === "automations" && (
                  <AutomationsView
                    user={user}
                    autos={autos}
                    setAutos={setAutos}
                    toast={toast}
                  />
                )}
                {view === "integration" && (
                  <IntegrationView
                    user={user}
                    projects={projects}
                    setProjects={setProjects}
                    syncLog={syncLog}
                    setSyncLog={setSyncLog}
                    autos={autos}
                    toast={toast}
                  />
                )}
                {view === "metrics" && <MetricsView />}
                {view === "project" && !curCalc && (
                  <ProjectDetail
                    pid={pid}
                    projects={projects}
                    setProjects={setProjects}
                    user={user}
                    back={() => {
                      setView("projects");
                      setPid(null);
                    }}
                    runCalc={runCalc}
                    toast={toast}
                  />
                )}
                {view === "project" && curCalc && (
                  <CalcRunner
                    project={curProj}
                    calc={curCalc}
                    user={user}
                    back={() => setRunCtx(null)}
                    toast={toast}
                    markComplete={markComplete}
                    onNewRev={newRevision}
                    onCheck={checkCalc}
                  />
                )}
              </div>
            </div>
            {toastNode}
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
